[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "swot-pixc-lab"
version = "0.1.0"
description = "Reproducible discovery and ingestion tools for SWOT L2 HR PIXC data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "SWOT PIXC Lab contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "earthaccess>=0.18,<1",
  "pandas>=2.2,<4",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0,<2",
]
notebook = [
  "ipykernel>=6.29",
  "nbformat>=5.10",
]
dev = [
  "nbformat>=5.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swot_pixc_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that contact NASA services and may require Earthdata credentials",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
